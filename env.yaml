# Conda environment for the full ball-on-arc benchmark
# Cross-platform: Linux, macOS (Intel + Apple Silicon)
#
# Usage:
#   conda env create -f env.yaml
#   conda activate balancer
#   pip install -e "balancer/[all]"
#
# This is the single environment file for the project (figures, sim eval,
# training, and hardware) - there is no separate lighter environment file.
#
# Package versions are pinned exactly to the reference environment that
# produced the released tables, figures, and checkpoints. A pip-installable
# mirror of these pins is in requirements.lock.txt. If a pinned build is
# unavailable on your platform, relax the pin for that single package only.

name: balancer
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  # -- Scientific core --
  - numpy==2.2.6
  - scipy==1.16.0
  - matplotlib==3.10.3
  - pandas==2.3.3
  - seaborn==0.13.2
  - h5py==3.14.0
  - pyyaml==6.0.3
  - scikit-learn==1.7.0
  - tqdm==4.67.1
  # -- PyTorch --
  - pytorch==2.10.0
  - pip
  - pip:
      # RL stack
      - gymnasium==1.0.0
      - stable-baselines3==2.9.0
      - sb3-contrib==2.9.0
      - moviepy==2.1.2     # video capture during RL training (capture_video: True)
      - hydra-core==1.3.4
      - omegaconf==2.3.1
      - wandb==0.24.2
      - tensorboard==2.21.0
      - rich==13.9.4
      # MPC / NMPC
      - osqp==1.1.3
      - casadi==3.7.2
      # Offline RL
      - d3rlpy==2.8.1
      # Classical tuning (CMA-ES) + parallelism
      - cma==4.4.4
      - joblib==1.5.1
      # Hardware (only needed on the control PC)
      - pyserial==3.5
      # Model export (only needed for website)
      - onnxruntime==1.27.0
      # Test suite
      - pytest==9.1.1
